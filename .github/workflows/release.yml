name: Release

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  test:
    uses: ./.github/workflows/ci.yml
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            formats: deb,appimage
            arch: linux-x86_64
          - os: windows-latest
            formats: nsis
            arch: windows-x86_64
          - os: macos-latest
            formats: dmg
            arch: macos-aarch64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libssl-dev \
            libgtk-3-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libvulkan-dev \
            libasound2-dev \
            libfontconfig1-dev \
            libfuse2 \
            rpm

      - name: Cache Cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build release binary
        env:
          RUSTFLAGS: ${{ matrix.os == 'windows-latest' && '-C target-feature=+crt-static' || '' }}
        run: cargo build --release

      - name: Install cargo-packager
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-packager

      - name: Install cargo-generate-rpm
        if: matrix.os == 'ubuntu-latest'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-generate-rpm

      - name: Package
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: cargo packager --release --formats ${{ matrix.formats }}

      - name: Build RPM
        if: matrix.os == 'ubuntu-latest'
        run: cargo generate-rpm --output dist/

      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p upload
          # installers/packages only; skip intermediate build dirs
          find dist -maxdepth 1 -type f \
            \( -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' \
               -o -name '*.dmg' -o -name '*setup.exe' -o -name '*.exe' \) \
            -exec cp {} upload/ \;
          ls -la upload

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dockeep-${{ matrix.arch }}
          path: upload/*

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version from Cargo.toml
        id: version
        run: |
          VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create or update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Release ${{ steps.version.outputs.tag }}
          make_latest: true
          generate_release_notes: true
          files: artifacts/*
