[package]
name = "dockeep"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
anyhow = "1.0.104"
git2 = "0.21.0"
gpui-kit = "0.6"
tracing = "0.1.44"
dirs = "7.0.0"
serde = "1.0.229"
serde_json = "1.0.151"
rust-i18n = "4.2.1"
rfd = "0.17.2"
regex = "1.13.1"
walkdir = "2.5.0"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
headless_chrome = "1.0.22"
futures = "0.3.34"
chrono = "0.4.45"
img-parts = "0.4.0"
tempfile = "3.27.0"
imagesize = "0.15.0"
base64 = "0.23.1"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }

ureq = { version = "3.4.2", features = ["json"] }

# Fast iteration: skip most optimization, keep debug info light,
# and (most impactful) build dependencies with some optimization
# once so you're not re-optimizing GPUI/wgpu on every change.
[profile.dev]
opt-level = 0
debug = "line-tables-only"  # enough for backtraces, much faster than full debuginfo
incremental = true
codegen-units = 4          # more parallel codegen units = faster compile

[profile.dev.package."*"]
opt-level = 2                 # your deps (gpui, wgpu, etc.) only get optimized once,
                               # cached, and re-linked fast on every rebuild of your own code

# Small, optimized release binary.
[profile.release]
opt-level = "z"       # optimize for size ("s" is size-focused too but less aggressive)
lto = true            # link-time optimization, strips dead code across crates
codegen-units = 1     # required for LTO to be maximally effective
panic = "abort"       # drops unwinding tables — real size win, but no catch_unwind
strip = true          # strips symbols from the final binary

[package.metadata.packager]
product-name = "Dockeep"
identifier = "dockeep.hazyio.com"
out-dir = "dist"
binaries-dir = "target/release"
binaries = [{ path = "dockeep", main = true }]
# ico for Windows, icns for macOS, png for Linux.
icons = ["assets/icon.ico", "assets/icon.icns", "assets/icon.png"]

[package.metadata.generate-rpm]
assets = [
  { source = "target/release/dockeep", dest = "/usr/bin/dockeep", mode = "755" },
]
